<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mic Plot — Simulation Tests</title>
  <style>
    body { font-family: 'SF Mono','Fira Code',monospace; background: #0d1117; color: #e6edf3; padding: 24px; font-size: 13px; line-height: 1.6; }
    h1 { font-size: 18px; margin-bottom: 4px; }
    p.note { color: #8b949e; margin-bottom: 16px; }
    .pass { color: #3fb950; }
    .fail { color: #f85149; }
    .test-line { margin: 2px 0; }
    .detail { color: #8b949e; margin-left: 3em; white-space: pre-wrap; }
    .summary { margin-top: 24px; padding: 12px 16px; border-radius: 8px; font-weight: 700; font-size: 15px; }
    .summary.all-pass { background: rgba(63,185,80,0.15); color: #3fb950; border: 1px solid rgba(63,185,80,0.3); }
    .summary.has-fail { background: rgba(248,81,73,0.15); color: #f85149; border: 1px solid rgba(248,81,73,0.3); }
  </style>
</head>
<body>
  <h1>Bluegrass Mic Plot — Simulation Tests</h1>
  <p class="note">Runs tests/cases.mjs against sim.js, the same module the app uses. The same cases run in CI with <code>node --test</code>.</p>
  <div id="results"></div>

  <script type="module">
    import { cases } from './tests/cases.mjs';

    const resultsEl = document.getElementById('results');
    let passed = 0, failed = 0;
    for (const [name, fn] of cases) {
      const line = document.createElement('div');
      line.className = 'test-line';
      try {
        fn();
        passed++;
        line.innerHTML = '<span class="pass">PASS</span> ';
        line.append(name);
      } catch (e) {
        failed++;
        line.innerHTML = '<span class="fail">FAIL</span> ';
        line.append(name);
        const d = document.createElement('div');
        d.className = 'detail';
        d.textContent = e && e.message ? e.message : String(e);
        line.append(d);
      }
      resultsEl.appendChild(line);
    }
    const summaryEl = document.createElement('div');
    summaryEl.className = `summary ${failed === 0 ? 'all-pass' : 'has-fail'}`;
    summaryEl.textContent = failed === 0 ? `ALL ${passed} TESTS PASSED` : `${failed} of ${passed + failed} FAILED (${passed} passed)`;
    resultsEl.appendChild(summaryEl);
    console.log(`Tests: ${passed}/${passed + failed} passed, ${failed} failed`);
  </script>
</body>
</html>
